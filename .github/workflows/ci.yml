name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      # The first Forge run installs pinned-source compiler requirements.
      # Reproduction then runs offline and requires all 16 attributed rows.
      - run: make test
      - run: make reproduce
